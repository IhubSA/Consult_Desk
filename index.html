function invoiceSubtotal(inv) {
  return (inv.lineItems || []).reduce((s, li) => s + Number(li.amount || 0), 0);
}
function invoiceTax(inv) {
  return invoiceSubtotal(inv) * (Number(inv.taxRate || 0) / 100);
}
function invoiceTotal(inv) {
  return invoiceSubtotal(inv) + invoiceTax(inv);
}
function nextInvoiceNumber(invoices, prefix) {
  const nums = invoices.map((i) => parseInt((i.number || "").replace(/\D/g, ""), 10)).filter((n) => !isNaN(n));
  const next = (nums.length ? Math.max(...nums) : 1000) + 1;
  return `${prefix || "INV"}-${next}`;
}

function BillingView({ ctx }) {
  const { clients, projects, timeEntries, invoices, settings } = ctx;
  const [editing, setEditing] = useState(null); // "new" | invoice
  const [viewing, setViewing] = useState(null); // invoice to view/print
  const [filter, setFilter] = useState("all");

  const list = invoices.items.filter((i) => filter === "all" || i.status === filter).sort((a, b) => b.date.localeCompare(a.date));

  const save = (form) => {
    if (form.id) {
      invoices.update(form.id, form);
    } else {
      const withNum = { ...form, number: form.number || nextInvoiceNumber(invoices.items, settings.settings.invoicePrefix) };
      invoices.add(withNum);
      // mark the source time entries as billed
      const billedIds = (form.lineItems || []).filter((li) => li.entryId).map((li) => li.entryId);
      if (billedIds.length) {
        timeEntries.setAll(timeEntries.items.map((t) => billedIds.includes(t.id) ? { ...t, billed: true } : t));
      }
    }
    setEditing(null);
  };

  const setStatus = (inv, status) => {
    if (status === "paid") {
      const method = window.prompt("How was this paid? (e.g. Bank Transfer, Cash, Card)", inv.paymentMethod || "Bank Transfer");
      if (method === null) return; // cancelled
      invoices.update(inv.id, { status, paidDate: todayISO(), paymentMethod: method || "Bank Transfer" });
    } else {
      invoices.update(inv.id, { status });
    }
  };

  return (
    <div className="cd-page">
      <PageHead
        eyebrow="money"
        title="Billing"
        action={<Btn kind="primary" icon={Plus} onClick={() => setEditing("new")} disabled={clients.items.length === 0}>New invoice</Btn>}
      />

      <div className="cd-tabs">
        {["all", "draft", "sent", "paid", "overdue"].map((f) => (
          <button key={f} className={"cd-tab" + (filter === f ? " active" : "")} onClick={() => setFilter(f)}>{f}</button>
        ))}
      </div>

      {invoices.items.length === 0 ? (
        <Empty icon={Receipt} title="No invoices yet" hint="Generate one from logged, unbilled hours." />
      ) : list.length === 0 ? (
        <Empty icon={Receipt} title="Nothing here" />
      ) : (
        <table className="cd-table">
          <thead><tr><th>Number</th><th>Client</th><th>Date</th><th>Due</th><th>Currency</th><th>Total</th><th>Status</th><th /></tr></thead>
          <tbody>
            {list.map((inv) => (
              <tr key={inv.id}>
                <td className="mono">{inv.number}</td>
                <td>{clientName(clients, inv.clientId)}</td>
                <td className="mono">{fmtDate(inv.date)}</td>
                <td className="mono">{fmtDate(inv.dueDate)}</td>
                <td className="mono">{inv.currency || "USD"}</td>
                <td className="mono">{fmtMoney(invoiceTotal(inv), inv.currency)}</td>
                <td><Stamp status={inv.status} /></td>
                <td>
                  <div className="cd-row-actions">
                    <button className="cd-iconbtn" onClick={() => setViewing(inv)} title="View / statement"><FileText size={14} /></button>
                    {inv.status === "draft" && <button className="cd-iconbtn" onClick={() => setStatus(inv, "sent")} title="Mark sent"><Send size={14} /></button>}
                    {inv.status !== "paid" && <button className="cd-iconbtn" onClick={() => setStatus(inv, "paid")} title="Mark paid"><CircleCheck size={14} /></button>}
                    <button className="cd-iconbtn danger" onClick={() => { if (confirm("Delete this invoice?")) invoices.remove(inv.id); }}><Trash2 size={14} /></button>
                  </div>
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      )}

      {editing && (
        <Modal title="New invoice" onClose={() => setEditing(null)} wide>
          <InvoiceForm clients={clients.items} projects={projects.items} timeEntries={timeEntries.items} invoices={invoices.items} settings={settings.settings} onSave={save} />
        </Modal>
      )}

      {viewing && (
        <Modal title={viewing.number} onClose={() => setViewing(null)} wide>
          <InvoiceDoc invoice={viewing} clients={clients.items} allInvoices={invoices.items} companyName={settings.settings.companyName} settings={settings.settings} />
        </Modal>
      )}
    </div>
  );
}

function InvoiceForm({ clients, projects, timeEntries, invoices, settings, onSave }) {
  const [clientId, setClientId] = useState(clients[0]?.id || "");
  const clientProjects = projects.filter((p) => p.clientId === clientId);
  const clientCurrencies = [...new Set(clientProjects.map((p) => p.currency || "USD"))];
  const [currency, setCurrency] = useState(clientCurrencies[0] || settings?.defaultCurrency || "USD");
  const unbilled = timeEntries.filter((t) => !t.billed && clientProjects.some((p) => p.id === t.projectId && (p.currency || "USD") === currency));

  const [selected, setSelected] = useState({}); // entryId -> bool
  const [manualItems, setManualItems] = useState([]); // {desc, amount}
  const [date, setDate] = useState(todayISO());
  const [dueDate, setDueDate] = useState(() => {
    const d = new Date(); d.setDate(d.getDate() + 14); return d.toISOString().slice(0, 10);
  });
  const [taxRate, setTaxRate] = useState(settings?.defaultTaxRate || 0);

  const lineItems = useMemo(() => {
    const fromTime = unbilled.filter((t) => selected[t.id]).map((t) => {
      const proj = projects.find((p) => p.id === t.projectId);
      const rate = proj?.hourlyRate || 0;
      return { entryId: t.id, desc: `${proj?.name || "Project"} — ${t.description || fmtDate(t.date)}`, hours: t.hours, rate, amount: rate * t.hours };
    });
    const fromManual = manualItems.filter((m) => m.desc && m.amount).map((m) => ({ desc: m.desc, amount: Number(m.amount) }));
    return [...fromTime, ...fromManual];
  }, [selected, manualItems, unbilled, projects]);

  const subtotal = lineItems.reduce((s, li) => s + Number(li.amount || 0), 0);
  const taxAmount = subtotal * (Number(taxRate || 0) / 100);
  const total = subtotal + taxAmount;

  const addManual = () => setManualItems([...manualItems, { desc: "", amount: "" }]);
  const updateManual = (i, patch) => setManualItems(manualItems.map((m, idx) => idx === i ? { ...m, ...patch } : m));
  const removeManual = (i) => setManualItems(manualItems.filter((_, idx) => idx !== i));

  return (
    <form className="cd-form" onSubmit={(e) => {
      e.preventDefault();
      if (lineItems.length === 0) return;
      onSave({ clientId, currency, date, dueDate, lineItems, taxRate: Number(taxRate) || 0, status: "draft", number: nextInvoiceNumber(invoices, settings?.invoicePrefix) });
    }}>
      <div className="cd-form-row">
        <Field label="Client">
          <select value={clientId} onChange={(e) => {
            setClientId(e.target.value);
            setSelected({});
            const newCur = [...new Set(projects.filter((p) => p.clientId === e.target.value).map((p) => p.currency || "USD"))];
            setCurrency(newCur[0] || settings?.defaultCurrency || "USD");
          }}>
            {clients.map((c) => <option key={c.id} value={c.id}>{c.company || c.name}</option>)}
          </select>
        </Field>
        <Field label="Currency">
          <select value={currency} onChange={(e) => { setCurrency(e.target.value); setSelected({}); }}>
            {CURRENCY_CODES.map((c) => <option key={c} value={c}>{c}</option>)}
          </select>
        </Field>
      </div>
      <div className="cd-form-row">
        <Field label="Invoice date"><input type="date" value={date} onChange={(e) => setDate(e.target.value)} /></Field>
        <Field label="Due date"><input type="date" value={dueDate} onChange={(e) => setDueDate(e.target.value)} /></Field>
      </div>

      <div className="cd-subhead">Unbilled hours ({currency})</div>
      {unbilled.length === 0 ? (
        <div className="cd-hint">No unbilled {currency} hours for this client — add manual line items below, or switch currency if their projects use a different one.</div>
      ) : (
        <ul className="cd-checklist">
          {unbilled.map((t) => {
            const proj = projects.find((p) => p.id === t.projectId);
            const amount = (proj?.hourlyRate || 0) * t.hours;
            return (
              <li key={t.id}>
                <label>
                  <input type="checkbox" checked={!!selected[t.id]} onChange={(e) => setSelected({ ...selected, [t.id]: e.target.checked })} />
                  <span>{proj?.name} — {t.description || fmtDate(t.date)}</span>
                  <span className="mono">{fmtHrs(t.hours)} · {fmtMoney(amount, currency)}</span>
                </label>
              </li>
            );
          })}
        </ul>
      )}

      <div className="cd-subhead">Manual line items</div>
      {manualItems.map((m, i) => (
        <div className="cd-form-row" key={i}>
          <input placeholder="Description" value={m.desc} onChange={(e) => updateManual(i, { desc: e.target.value })} />
          <input type="number" placeholder="Amount" style={{ maxWidth: 120 }} value={m.amount} onChange={(e) => updateManual(i, { amount: e.target.value })} />
          <button type="button" className="cd-iconbtn danger" onClick={() => removeManual(i)}><Trash2 size={14} /></button>
        </div>
      ))}
      <button type="button" className="cd-linkbtn" onClick={addManual}><Plus size={14} /> Add line item</button>

      <Field label="Tax / VAT rate (%)"><input type="number" min="0" step="0.1" value={taxRate} onChange={(e) => setTaxRate(e.target.value)} placeholder="e.g. 15" /></Field>

      <div className="cd-invoice-total" style={{ fontSize: 13, fontWeight: 400 }}>Subtotal: <span className="mono">{fmtMoney(subtotal, currency)}</span></div>
      {taxAmount > 0 && <div className="cd-invoice-total" style={{ fontSize: 13, fontWeight: 400 }}>Tax ({taxRate}%): <span className="mono">{fmtMoney(taxAmount, currency)}</span></div>}
      <div className="cd-invoice-total">Total: <span className="mono">{fmtMoney(total, currency)}</span></div>
      <div className="cd-form-actions"><Btn kind="primary" type="submit" disabled={lineItems.length === 0}>Create draft invoice</Btn></div>
    </form>
  );
}

function InvoiceDoc({ invoice, clients, allInvoices, companyName, settings }) {
  const [copied, setCopied] = useState(false);
  const client = clients.find((c) => c.id === invoice.clientId);
  const cur = invoice.currency || "USD";
  const subtotal = invoiceSubtotal(invoice);
  const tax = invoiceTax(invoice);
  const total = invoiceTotal(invoice);
  const isReceipt = invoice.status === "paid";
  const receiptNumber = "RCT-" + (invoice.number || "").replace(/\D/g, "");

  // client statement = all invoices for this client in the same currency
  const statementInvoices = allInvoices.filter((i) => i.clientId === invoice.clientId && (i.currency || "USD") === cur).sort((a, b) => a.date.localeCompare(b.date));
  const balanceDue = statementInvoices.filter((i) => i.status !== "paid").reduce((s, i) => s + invoiceTotal(i), 0);

  const hasBankDetails = settings?.bankName || settings?.bankAccountNumber;

  const text = [
    companyName || null,
    settings?.companyAddress || null,
    settings?.vatNumber ? `VAT No: ${settings.vatNumber}` : null,
    "",
    isReceipt ? "RECEIPT" : "INVOICE",
    isReceipt ? `Receipt No: ${receiptNumber}  (Invoice: ${invoice.number})` : `Invoice No: ${invoice.number}`,
    "",
    `Bill to: ${client?.company || client?.name || "—"}`,
    client?.email ? `Email: ${client.email}` : null,
    `Date: ${fmtDate(invoice.date)}`,
    `Due: ${fmtDate(invoice.dueDate)}`,
    isReceipt ? `Paid: ${fmtDate(invoice.paidDate)}${invoice.paymentMethod ? ` via ${invoice.paymentMethod}` : ""}` : null,
    "", "Line items:",
    ...invoice.lineItems.map((li) => `- ${li.desc}${li.hours ? ` (${fmtHrs(li.hours)} @ ${fmtMoney(li.rate, cur)})` : ""} — ${fmtMoney(li.amount, cur)}`),
    "",
    `Subtotal: ${fmtMoney(subtotal, cur)}`,
    tax > 0 ? `Tax (${invoice.taxRate}%): ${fmtMoney(tax, cur)}` : null,
    `Total: ${fmtMoney(total, cur)} ${cur}`,
    !isReceipt && settings?.paymentTerms ? `\n${settings.paymentTerms}` : null,
    !isReceipt && hasBankDetails ? `\nBanking details:\n${settings.bankName || ""}\n${settings.bankAccountName || ""}\n${settings.bankAccountNumber || ""}${settings.bankBranchCode ? `\nBranch: ${settings.bankBranchCode}` : ""}` : null,
  ].filter(Boolean).join("\n");

  const copy = () => { navigator.clipboard.writeText(text); setCopied(true); setTimeout(() => setCopied(false), 1500); };

  return (
    <div className="cd-doc cd-printable">
      <DocLetterhead
        companyName={companyName}
        settings={settings}
        kind={isReceipt ? "Receipt" : "Invoice"}
        number={isReceipt ? receiptNumber : invoice.number}
        subtitle={isReceipt ? `For invoice ${invoice.number}` : null}
        currency={cur}
        status={invoice.status}
      />
      <div className="cd-doc-grid">
        <div><span>Bill to</span><strong>{client?.company || client?.name}</strong>{client?.email && <div className="cd-muted">{client.email}</div>}{client?.address && <div className="cd-muted" style={{ whiteSpace: "pre-line" }}>{client.address}</div>}{client?.taxNumber && <div className="cd-muted">Tax No: {client.taxNumber}</div>}</div>
        <div><span>Date</span><strong className="mono">{fmtDate(invoice.date)}</strong></div>
        <div><span>{isReceipt ? "Paid" : "Due"}</span><strong className="mono">{fmtDate(isReceipt ? invoice.paidDate : invoice.dueDate)}</strong></div>
      </div>
      {isReceipt && invoice.paymentMethod && (
        <div className="cd-hint">Payment received via <strong>{invoice.paymentMethod}</strong></div>
      )}
      <table className="cd-table">
        <thead><tr><th>Description</th><th>Hours</th><th>Rate</th><th>Amount</th></tr></thead>
        <tbody>
          {invoice.lineItems.map((li, i) => (
            <tr key={i}>
              <td>{li.desc}</td>
              <td className="mono">{li.hours ? fmtHrs(li.hours) : "—"}</td>
              <td className="mono">{li.rate ? fmtMoney(li.rate, cur) : "—"}</td>
              <td className="mono">{fmtMoney(li.amount, cur)}</td>
            </tr>
          ))}
        </tbody>
      </table>
      <div className="cd-invoice-total" style={{ fontSize: 13, fontWeight: 400 }}>Subtotal: <span className="mono">{fmtMoney(subtotal, cur)}</span></div>
      {tax > 0 && <div className="cd-invoice-total" style={{ fontSize: 13, fontWeight: 400 }}>Tax ({invoice.taxRate}%): <span className="mono">{fmtMoney(tax, cur)}</span></div>}
      <div className="cd-invoice-total">Total: <span className="mono">{fmtMoney(total, cur)}</span></div>

      {!isReceipt && settings?.paymentTerms && (
        <div className="cd-notes" style={{ marginTop: 16 }}>{settings.paymentTerms}</div>
      )}
      {!isReceipt && hasBankDetails && (
        <div className="cd-bank-details">
          <div className="cd-subhead">Banking details</div>
          {settings.bankName && <div className="cd-kv"><span>Bank</span><span>{settings.bankName}</span></div>}
          {settings.bankAccountName && <div className="cd-kv"><span>Account name</span><span>{settings.bankAccountName}</span></div>}
          {settings.bankAccountNumber && <div className="cd-kv"><span>Account number</span><span className="mono">{settings.bankAccountNumber}</span></div>}
          {settings.bankBranchCode && <div className="cd-kv"><span>Branch code</span><span className="mono">{settings.bankBranchCode}</span></div>}
        </div>
      )}

      <div className="cd-subhead" style={{ marginTop: 20 }}>Client statement ({cur} invoices)</div>
      <table className="cd-table">
        <thead><tr><th>Number</th><th>Date</th><th>Status</th><th>Amount</th></tr></thead>
        <tbody>
          {statementInvoices.map((i) => (
            <tr key={i.id}>
              <td className="mono">{i.number}</td>
              <td className="mono">{fmtDate(i.date)}</td>
              <td><Stamp status={i.status} /></td>
              <td className="mono">{fmtMoney(invoiceTotal(i), cur)}</td>
            </tr>
          ))}
        </tbody>
      </table>
      <div className="cd-invoice-total">Balance due: <span className="mono">{fmtMoney(balanceDue, cur)}</span></div>

      <div className="cd-doc-footer">{isReceipt ? "Thank you for your payment." : "Thank you for your business."}</div>

      <div className="cd-form-actions">
        <Btn icon={Printer} onClick={() => window.print()}>Print / Save as PDF</Btn>
        <Btn kind="primary" icon={copied ? Check : Copy} onClick={copy}>{copied ? "Copied" : "Copy as text"}</Btn>
      </div>
    </div>
  );
}

/* ------------------------------ Messages ------------------------------ */
function MessagesView({ ctx }) {
  const { clients, projects, timeEntries, invoices, settings, comms } = ctx;
  const companyName = settings.settings.companyName;
  const [clientId, setClientId] = useState(clients.items[0]?.id || "");
  const [kind, setKind] = useState("update"); // update | invoice
  const [invoiceId, setInvoiceId] = useState("");
  const [copied, setCopied] = useState(false);

  const clientProjects = projects.items.filter((p) => p.clientId === clientId);
  const recentEntries = timeEntries.items
    .filter((t) => clientProjects.some((p) => p.id === t.projectId))
    .sort((a, b) => b.date.localeCompare(a.date))
    .slice(0, 6);
  const clientInvoices = invoices.items.filter((i) => i.clientId === clientId);
  const client = clients.items.find((c) => c.id === clientId);

  const updateDraft = useMemo(() => {
    if (!client) return "";
    const lines = clientProjects.map((p) => {
      const hrs = timeEntries.items.filter((t) => t.projectId === p.id).reduce((s, t) => s + Number(t.hours || 0), 0);
      return `• ${p.name} (${p.status}) — ${fmtHrs(hrs)} logged so far`;
    });
    const recentWork = recentEntries.map((t) => `  - ${fmtDate(t.date)}: ${t.description || "work session"} (${fmtHrs(t.hours)})`);
    return [
      `Subject: Project update — ${client.company || client.name}`, "",
      `Hi ${client.name.split(" ")[0]},`, "",
      "Quick update on where things stand:", "",
      ...lines, "",
      "Recent activity:",
      ...recentWork, "",
      "Let me know if you'd like to hop on a call to go deeper on any of this.", "",
      "Best,", companyName,
    ].join("\n");
  }, [client, clientProjects, timeEntries.items, recentEntries, companyName]);

  const invoiceDraft = useMemo(() => {
    const inv = clientInvoices.find((i) => i.id === invoiceId);
    if (!client || !inv) return "";
    const cur = inv.currency || "USD";
    return [
      `Subject: Invoice ${inv.number} — ${fmtMoney(invoiceTotal(inv), cur)} due ${fmtDate(inv.dueDate)}`, "",
      `Hi ${client.name.split(" ")[0]},`, "",
      `Please find invoice ${inv.number} attached, totaling ${fmtMoney(invoiceTotal(inv), cur)}, due ${fmtDate(inv.dueDate)}.`, "",
      "Summary:",
      ...inv.lineItems.map((li) => `• ${li.desc} — ${fmtMoney(li.amount, cur)}`), "",
      "Let me know if you have any questions.", "",
      "Best,", companyName,
    ].join("\n");
  }, [client, clientInvoices, invoiceId, companyName]);

  const draft = kind === "update" ? updateDraft : invoiceDraft;
  const copy = () => {
    navigator.clipboard.writeText(draft);
    setCopied(true);
    if (clientId && draft) comms.add({ clientId, kind, date: todayISO() });
    setTimeout(() => setCopied(false), 1500);
  };

  return (
    <div className="cd-page">
      <PageHead eyebrow="communication" title="Messages" />

      {clients.items.length === 0 ? (
        <Empty icon={Mail} title="Add a client first" />
      ) : (
        <div className="cd-grid-2">
          <section className="cd-card">
            <div className="cd-card-head"><h3>Draft a message</h3></div>
            <Field label="Client">
              <select value={clientId} onChange={(e) => { setClientId(e.target.value); setInvoiceId(""); }}>
                {clients.items.map((c) => <option key={c.id} value={c.id}>{c.company || c.name}</option>)}
              </select>
            </Field>
            <Field label="Message type">
              <select value={kind} onChange={(e) => setKind(e.target.value)}>
                <option value="update">Project progress update</option>
                <option value="invoice">Invoice notice</option>
              </select>
            </Field>
            {kind === "invoice" && (
              <Field label="Invoice">
                <select value={invoiceId} onChange={(e) => setInvoiceId(e.target.value)}>
                  <option value="">Select an invoice…</option>
                  {clientInvoices.map((i) => <option key={i.id} value={i.id}>{i.number} — {fmtMoney(invoiceTotal(i), i.currency)}</option>)}
                </select>
              </Field>
            )}
            <div className="cd-hint" style={{ marginTop: 8 }}>
              This drafts the message for you — copying it also logs a follow-up so the Dashboard knows this client's been contacted. To actually send it, paste it into your own email, or ask Claude in chat to draft it straight into your connected Gmail account.
            </div>
          </section>

          <section className="cd-card">
            <div className="cd-card-head">
              <h3>Preview</h3>
              <Btn icon={copied ? Check : Copy} onClick={copy} disabled={!draft}>{copied ? "Copied" : "Copy"}</Btn>
            </div>
            <pre className="cd-draft">{draft || "Nothing to preview yet."}</pre>
          </section>
        </div>
      )}
    </div>
  );
}

/* ------------------------------ Reports ------------------------------ */
function ReportsView({ ctx }) {
  const { clients, projects, timeEntries, invoices } = ctx;

  const fmtByCurrency = (obj) => {
    const keys = Object.keys(obj);
    if (keys.length === 0) return "—";
    return keys.map((cur) => fmtMoney(obj[cur], cur)).join(" · ");
  };

  const months = Array.from({ length: 6 }, (_, i) => {
    const d = new Date(); d.setDate(1); d.setMonth(d.getMonth() - (5 - i));
    return d.toISOString().slice(0, 7);
  });

  const monthlyRows = months.map((ym) => {
    const hrs = timeEntries.items.filter((t) => t.date.startsWith(ym)).reduce((s, t) => s + Number(t.hours || 0), 0);
    const invoicedByCur = {};
    invoices.items.filter((i) => i.date.startsWith(ym)).forEach((i) => {
      const cur = i.currency || "USD";
      invoicedByCur[cur] = (invoicedByCur[cur] || 0) + invoiceTotal(i);
    });
    const paidByCur = {};
    invoices.items.filter((i) => i.status === "paid" && (i.paidDate || "").startsWith(ym)).forEach((i) => {
      const cur = i.currency || "USD";
      paidByCur[cur] = (paidByCur[cur] || 0) + invoiceTotal(i);
    });
    return { ym, label: monthLabelShort(ym), hrs, invoicedByCur, paidByCur };
  });
  const maxHrs = Math.max(1, ...monthlyRows.map((r) => r.hrs));

  // one row per client per currency they've been billed or worked in
  const clientRows = [];
  clients.items.forEach((c) => {
    const cProjects = projects.items.filter((p) => p.clientId === c.id);
    const currenciesUsed = [...new Set([
      ...cProjects.map((p) => p.currency || "USD"),
      ...invoices.items.filter((i) => i.clientId === c.id).map((i) => i.currency || "USD"),
    ])];
    currenciesUsed.forEach((cur) => {
      const curProjectIds = cProjects.filter((p) => (p.currency || "USD") === cur).map((p) => p.id);
      const hrs = timeEntries.items.filter((t) => curProjectIds.includes(t.projectId)).reduce((s, t) => s + Number(t.hours || 0), 0);
      const earned = timeEntries.items.reduce((s, t) => {
        const p = cProjects.find((p) => p.id === t.projectId && (p.currency || "USD") === cur);
        return p ? s + Number(t.hours || 0) * Number(p.hourlyRate || 0) : s;
      }, 0);
      const invoiced = invoices.items.filter((i) => i.clientId === c.id && (i.currency || "USD") === cur).reduce((s, i) => s + invoiceTotal(i), 0);
      const paid = invoices.items.filter((i) => i.clientId === c.id && (i.currency || "USD") === cur && i.status === "paid").reduce((s, i) => s + invoiceTotal(i), 0);
      if (hrs > 0 || invoiced > 0) clientRows.push({ client: c, currency: cur, hrs, earned, invoiced, paid });
    });
  });
  clientRows.sort((a, b) => b.invoiced - a.invoiced);

  return (
    <div className="cd-page">
      <PageHead eyebrow="numbers" title="Reports" />

      <section className="cd-card">
        <div className="cd-card-head"><h3>Monthly summary</h3></div>
        <div className="cd-punchcard" style={{ height: 90, marginBottom: 14 }}>
          {monthlyRows.map((r) => (
            <div className="cd-punch-col" key={r.ym}>
              <div className="cd-punch-track">
                <div className="cd-punch-fill" style={{ height: `${(r.hrs / maxHrs) * 100}%` }} />
              </div>
              <div className="cd-punch-label">{r.label.split(" ")[0]}</div>
            </div>
          ))}
        </div>
        <table className="cd-table">
          <thead><tr><th>Month</th><th>Hours</th><th>Invoiced</th><th>Paid</th></tr></thead>
          <tbody>
            {monthlyRows.map((r) => (
              <tr key={r.ym}>
                <td>{r.label}</td>
                <td className="mono">{fmtHrs(r.hrs)}</td>
                <td className="mono">{fmtByCurrency(r.invoicedByCur)}</td>
                <td className="mono">{fmtByCurrency(r.paidByCur)}</td>
              </tr>
            ))}
          </tbody>
        </table>
      </section>

      <section className="cd-card">
        <div className="cd-card-head"><h3>Per-client profitability</h3></div>
        {clientRows.length === 0 ? (
          <Empty icon={BarChart3} title="No activity yet" hint="Log hours and create invoices to see client profitability here." />
        ) : (
          <table className="cd-table">
            <thead><tr><th>Client</th><th>Currency</th><th>Hours</th><th>Value of hours</th><th>Invoiced</th><th>Paid</th><th>Outstanding</th></tr></thead>
            <tbody>
              {clientRows.map((r) => (
                <tr key={r.client.id + r.currency}>
                  <td>{r.client.company || r.client.name}</td>
                  <td className="mono">{r.currency}</td>
                  <td className="mono">{fmtHrs(r.hrs)}</td>
                  <td className="mono">{fmtMoney(r.earned, r.currency)}</td>
                  <td className="mono">{fmtMoney(r.invoiced, r.currency)}</td>
                  <td className="mono">{fmtMoney(r.paid, r.currency)}</td>
                  <td className="mono">{fmtMoney(r.invoiced - r.paid, r.currency)}</td>
                </tr>
              ))}
            </tbody>
          </table>
        )}
      </section>
    </div>
  );
}

/* ------------------------------ Ledger ------------------------------ */
function invoiceIsAR(inv) {
  return inv.status === "sent" || inv.status === "overdue";
}

function LedgerView({ ctx }) {
  const { invoices, expenses, settings } = ctx;
  const [editing, setEditing] = useState(null); // "new" | expense

  const save = (form) => {
    if (form.id) expenses.update(form.id, form);
    else expenses.add(form);
    setEditing(null);
  };

  const currencies = [...new Set([
    ...invoices.items.map((i) => i.currency || "USD"),
    ...expenses.items.map((e) => e.currency || "USD"),
  ])];
  const activeCurrencies = currencies.length ? currencies : [settings.settings.defaultCurrency || "USD"];

  const balanceSheet = activeCurrencies.map((cur) => {
    const cash = invoices.items.filter((i) => i.status === "paid" && (i.currency || "USD") === cur).reduce((s, i) => s + invoiceTotal(i), 0)
      - expenses.items.filter((e) => e.status === "paid" && (e.currency || "USD") === cur).reduce((s, e) => s + Number(e.amount || 0), 0);
    const ar = invoices.items.filter((i) => invoiceIsAR(i) && (i.currency || "USD") === cur).reduce((s, i) => s + invoiceTotal(i), 0);
    const ap = expenses.items.filter((e) => e.status === "unpaid" && (e.currency || "USD") === cur).reduce((s, e) => s + Number(e.amount || 0), 0);
    const assets = cash + ar;
    const liabilities = ap;
    const equity = assets - liabilities;
    return { cur, cash, ar, ap, assets, liabilities, equity };
  });

  const ledgerEntries = [
    ...invoices.items.filter((i) => i.status === "paid").map((i) => ({
      id: "inv-" + i.id, date: i.paidDate || i.date, type: "income", desc: `Invoice ${i.number}`, amount: invoiceTotal(i), currency: i.currency || "USD",
    })),
    ...expenses.items.filter((e) => e.status === "paid").map((e) => ({
      id: "exp-" + e.id, date: e.date, type: "expense", desc: e.description || e.category || "Expense", amount: -Number(e.amount || 0), currency: e.currency || "USD",
    })),
  ].sort((a, b) => a.date.localeCompare(b.date));

  const runningByCur = {};
  const ledgerWithBalance = ledgerEntries.map((e) => {
    runningByCur[e.currency] = (runningByCur[e.currency] || 0) + e.amount;
    return { ...e, balance: runningByCur[e.currency] };
  });

  return (
    <div className="cd-page">
      <PageHead eyebrow="finances" title="Ledger" action={<Btn kind="primary" icon={Plus} onClick={() => setEditing("new")}>Add expense</Btn>} />

      <div className="cd-cardgrid">
        {balanceSheet.map((b) => (
          <div className="cd-card" key={b.cur}>
            <div className="cd-card-head"><h3>Balance sheet — {b.cur}</h3></div>
            <div className="cd-kv"><span>Cash</span><span className="mono">{fmtMoney(b.cash, b.cur)}</span></div>
            <div className="cd-kv"><span>Accounts receivable</span><span className="mono">{fmtMoney(b.ar, b.cur)}</span></div>
            <div className="cd-kv" style={{ fontWeight: 700, borderTop: "1px solid var(--border)", paddingTop: 6, marginTop: 2 }}><span>Total assets</span><span className="mono">{fmtMoney(b.assets, b.cur)}</span></div>
            <div className="cd-kv" style={{ marginTop: 10 }}><span>Accounts payable</span><span className="mono">{fmtMoney(b.liabilities, b.cur)}</span></div>
            <div className="cd-kv" style={{ fontWeight: 700, borderTop: "1px solid var(--border)", paddingTop: 6, marginTop: 2 }}><span>Total liabilities</span><span className="mono">{fmtMoney(b.liabilities, b.cur)}</span></div>
            <div className="cd-kv" style={{ marginTop: 10, fontWeight: 700, borderTop: "1px solid var(--ink)", paddingTop: 6 }}><span>Equity</span><span className="mono">{fmtMoney(b.equity, b.cur)}</span></div>
          </div>
        ))}
      </div>

      <section className="cd-card">
        <div className="cd-card-head"><h3>Cash ledger</h3></div>
        {ledgerWithBalance.length === 0 ? (
          <Empty icon={BookOpen} title="No income or expenses recorded yet" hint="Paid invoices and paid expenses will show up here automatically." />
        ) : (
          <table className="cd-table">
            <thead><tr><th>Date</th><th>Type</th><th>Description</th><th>Currency</th><th>Amount</th><th>Balance</th></tr></thead>
            <tbody>
              {ledgerWithBalance.map((e) => (
                <tr key={e.id}>
                  <td className="mono">{fmtDate(e.date)}</td>
                  <td><span className="cd-stamp" style={{ "--stamp-color": e.type === "income" ? "var(--success)" : "var(--danger)" }}>{e.type}</span></td>
                  <td>{e.desc}</td>
                  <td className="mono">{e.currency}</td>
                  <td className="mono" style={{ color: e.amount < 0 ? "var(--danger)" : "var(--success)" }}>{e.amount < 0 ? "-" : "+"}{fmtMoney(Math.abs(e.amount), e.currency)}</td>
                  <td className="mono">{fmtMoney(e.balance, e.currency)}</td>
                </tr>
              ))}
            </tbody>
          </table>
        )}
      </section>

      <section className="cd-card">
        <div className="cd-card-head"><h3>All expenses</h3></div>
        {expenses.items.length === 0 ? (
          <Empty icon={Receipt} title="No expenses logged yet" hint="Track software, hosting, travel, and other business costs here." />
        ) : (
          <table className="cd-table">
            <thead><tr><th>Date</th><th>Category</th><th>Description</th><th>Amount</th><th>Status</th><th /></tr></thead>
            <tbody>
              {[...expenses.items].sort((a, b) => b.date.localeCompare(a.date)).map((ex) => (
                <tr key={ex.id}>
                  <td className="mono">{fmtDate(ex.date)}</td>
                  <td>{ex.category || "—"}</td>
                  <td className="cd-td-desc">{ex.description || "—"}</td>
                  <td className="mono">{fmtMoney(ex.amount, ex.currency)}</td>
                  <td><span className="cd-stamp" style={{ "--stamp-color": ex.status === "paid" ? "var(--success)" : "var(--amber)" }}>{ex.status}</span></td>
                  <td>
                    <div className="cd-row-actions">
                      <button className="cd-iconbtn" onClick={() => setEditing(ex)}><Pencil size={14} /></button>
                      <button className="cd-iconbtn danger" onClick={() => expenses.remove(ex.id)}><Trash2 size={14} /></button>
                    </div>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        )}
      </section>

      {editing && (
        <Modal title={editing === "new" ? "Add expense" : "Edit expense"} onClose={() => setEditing(null)}>
          <ExpenseForm initial={editing === "new" ? null : editing} defaultCurrency={settings.settings.defaultCurrency} onSave={save} />
        </Modal>
      )}
    </div>
  );
}

function ExpenseForm({ initial, defaultCurrency, onSave }) {
  const [form, setForm] = useState(initial || {
    date: todayISO(), category: "", description: "", amount: "", currency: defaultCurrency || "USD", status: "paid",
  });
  const set = (k) => (e) => setForm({ ...form, [k]: e.target.value });
  return (
    <form className="cd-form" onSubmit={(e) => { e.preventDefault(); onSave({ ...form, amount: Number(form.amount) || 0 }); }}>
      <div className="cd-form-row">
        <Field label="Date"><input type="date" required value={form.date} onChange={set("date")} /></Field>
        <Field label="Currency">
          <select value={form.currency} onChange={set("currency")}>
            {CURRENCY_CODES.map((c) => <option key={c} value={c}>{c}</option>)}
          </select>
        </Field>
      </div>
      <Field label="Category"><input value={form.category} onChange={set("category")} placeholder="e.g. Software, Hosting, Travel" /></Field>
      <Field label="Description"><input value={form.description} onChange={set("description")} placeholder="What was this for?" /></Field>
      <div className="cd-form-row">
        <Field label="Amount"><input type="number" min="0" step="0.01" required value={form.amount} onChange={set("amount")} /></Field>
        <Field label="Status">
          <select value={form.status} onChange={set("status")}>
            <option value="paid">paid</option>
            <option value="unpaid">unpaid</option>
          </select>
        </Field>
      </div>
      <div className="cd-form-actions"><Btn kind="primary" type="submit">Save expense</Btn></div>
    </form>
  );
}

/* ------------------------------ Admin ------------------------------ */
function AdminView({ ctx }) {
  const { settings } = ctx;
  const [form, setForm] = useState(settings.settings);
  const [saved, setSaved] = useState(false);
  const set = (k) => (e) => setForm({ ...form, [k]: e.target.value });

  const onSubmit = (e) => {
    e.preventDefault();
    settings.save({ ...form, defaultHourlyRate: Number(form.defaultHourlyRate) || 0, defaultTaxRate: Number(form.defaultTaxRate) || 0 });
    setSaved(true);
    setTimeout(() => setSaved(false), 1500);
  };

  return (
    <div className="cd-page">
      <PageHead eyebrow="configuration" title="Admin" />

      <section className="cd-card" style={{ maxWidth: 560 }}>
        <div className="cd-card-head"><h3>Company details</h3></div>
        <form className="cd-form" onSubmit={onSubmit}>
          <Field label="Company name"><input value={form.companyName} onChange={set("companyName")} placeholder="ihubSA" /></Field>
          <Field label="Company email"><input type="email" value={form.companyEmail} onChange={set("companyEmail")} placeholder="ihubsa@gmail.com" /></Field>
          <Field label="Company address"><textarea rows={2} value={form.companyAddress} onChange={set("companyAddress")} placeholder="Street, city, country" /></Field>

          <div className="cd-subhead" style={{ marginTop: 6 }}>Billing defaults</div>
          <div className="cd-form-row">
            <Field label="Invoice number prefix"><input value={form.invoicePrefix} onChange={set("invoicePrefix")} placeholder="INV" /></Field>
            <Field label="Quote number prefix"><input value={form.quotePrefix} onChange={set("quotePrefix")} placeholder="QTE" /></Field>
            <Field label="Default currency">
              <select value={form.defaultCurrency} onChange={set("defaultCurrency")}>
                {CURRENCY_CODES.map((c) => <option key={c} value={c}>{CURRENCIES[c].label}</option>)}
              </select>
            </Field>
            <Field label="Default hourly rate"><input type="number" min="0" step="1" value={form.defaultHourlyRate} onChange={set("defaultHourlyRate")} /></Field>
          </div>
          <div className="cd-form-row">
            <Field label="VAT / Tax number"><input value={form.vatNumber} onChange={set("vatNumber")} placeholder="e.g. 4123456789" /></Field>
            <Field label="Default tax / VAT rate (%)"><input type="number" min="0" step="0.1" value={form.defaultTaxRate} onChange={set("defaultTaxRate")} placeholder="e.g. 15" /></Field>
          </div>
          <Field label="Payment terms (shown on invoices)">
            <textarea rows={2} value={form.paymentTerms} onChange={set("paymentTerms")} placeholder="Payment due within 14 days of invoice date." />
          </Field>

          <div className="cd-subhead" style={{ marginTop: 6 }}>Banking details (shown on invoices)</div>
          <div className="cd-form-row">
            <Field label="Bank name"><input value={form.bankName} onChange={set("bankName")} placeholder="e.g. Standard Bank" /></Field>
            <Field label="Account name"><input value={form.bankAccountName} onChange={set("bankAccountName")} placeholder="ihubSA" /></Field>
          </div>
          <div className="cd-form-row">
            <Field label="Account number"><input value={form.bankAccountNumber} onChange={set("bankAccountNumber")} /></Field>
            <Field label="Branch code"><input value={form.bankBranchCode} onChange={set("bankBranchCode")} /></Field>
          </div>

          <div className="cd-form-actions">
            <Btn kind="primary" type="submit" icon={saved ? Check : undefined}>{saved ? "Saved" : "Save settings"}</Btn>
          </div>
        </form>
      </section>

      <div className="cd-hint" style={{ maxWidth: 560 }}>
        These settings drive the company name shown in the sidebar and on invoices, receipts, and statements, plus the defaults used when creating new invoices and projects.
      </div>
    </div>
  );
}

  if (!session) return <LoginScreen />;

  return <App />;
}
