  const out = {};

  });
  return out;
}
function keysFromDb(row) {

/**
 * Same shape as the original artifact's useCollection hook —
 * { items, ready, add, update, remove, setAll } — so all the existing
 * view components work unchanged, just backed by Supabase instead of
 * window.storage.
 */
function useSupabaseCollection(table, orderColumn = "created_at") {
  const [items, setItems] = useState([]);
  const [ready, setReady] = useState(false);

  useEffect(() => {
    let cancelled = false;
    (async () => {
      const { data, error } = await sb
        .from(table)
        .select("*")
        .order(orderColumn, { ascending: false });
      if (cancelled) return;
      if (error) {
        console.error(`Failed to load ${table}:`, error.message);
        setItems([]);
      } else {
        setItems(data.map(keysFromDb));
      }
      setReady(true);
    })();
    return () => { cancelled = true; };
  }, [table, orderColumn]);

  const add = useCallback(async (item) => {
    const { data, error } = await sb
      .from(table)
      .insert(keysToDb(item))
      .select()
      .single();
    if (error) {
      console.error(`Failed to add to ${table}:`, error.message);
      return null;
    }
    const row = keysFromDb(data);
    setItems((prev) => [row, ...prev]);
    return row;
  }, [table]);

  const update = useCallback(async (id, patch) => {
    const { data, error } = await sb
      .from(table)
      .update(keysToDb(patch))
      .eq("id", id)
      .select()
      .single();
    if (error) {
      console.error(`Failed to update ${table}:`, error.message);
      return null;
    }
    const row = keysFromDb(data);
    setItems((prev) => prev.map((it) => (it.id === id ? row : it)));
    return row;
  }, [table]);

  const remove = useCallback(async (id) => {
    const { error } = await sb.from(table).delete().eq("id", id);
    if (error) {
      console.error(`Failed to delete from ${table}:`, error.message);
      return;
    }
    setItems((prev) => prev.filter((it) => it.id !== id));
  }, [table]);

  // Bulk replace — used by automations (overdue flip, retainer generation)
  // and by the billing flow marking several time entries as billed at once.
  const setAll = useCallback(async (next) => {
    const existingIds = new Set(items.map((it) => it.id));
    const toInsert = next.filter((it) => !it.id || !existingIds.has(it.id));
    const toUpdate = next.filter((it) => it.id && existingIds.has(it.id));

    if (toInsert.length) {
      const { error } = await sb.from(table).insert(toInsert.map(keysToDb));
      if (error) console.error(`Bulk insert into ${table} failed:`, error.message);
    }
    for (const it of toUpdate) {
      const { error } = await sb.from(table).update(keysToDb(it)).eq("id", it.id);
      if (error) console.error(`Bulk update on ${table} failed:`, error.message);
    }

    // Re-fetch so generated ids/defaults come back from the DB.
    const { data, error } = await sb
      .from(table)
      .select("*")
      .order(orderColumn, { ascending: false });
    if (!error) setItems(data.map(keysFromDb));
  }, [table, items, orderColumn]);

  return { items, ready, add, update, remove, setAll };
}

const DEFAULT_SETTINGS = {
  companyName: "ihubSA",
  companyEmail: "ihubsa@gmail.com",
  companyAddress: "",
  invoicePrefix: "INV",
  quotePrefix: "QTE",
  defaultHourlyRate: 100,
  defaultCurrency: "USD",
  bankName: "",
  bankAccountName: "",
  bankAccountNumber: "",
  bankBranchCode: "",
  vatNumber: "",
  defaultTaxRate: 0,
  paymentTerms: "Payment due within 14 days of invoice date.",
};

function useSupabaseSettings() {
  const [settings, setSettings] = useState(DEFAULT_SETTINGS);
  const [ready, setReady] = useState(false);

  useEffect(() => {
    let cancelled = false;
    (async () => {
      const { data, error } = await sb.from("settings").select("*").eq("id", 1).single();
      if (cancelled) return;
      if (!error && data) {
        const fromDb = keysFromDb(data);
        const nonNull = Object.fromEntries(Object.entries(fromDb).filter(([, v]) => v !== null));
        setSettings({ ...DEFAULT_SETTINGS, ...nonNull });
      }
      setReady(true);
    })();
    return () => { cancelled = true; };
  }, []);

  const save = useCallback(async (next) => {
    setSettings(next);
    const { error } = await sb.from("settings").update(keysToDb(next)).eq("id", 1);
    if (error) console.error("Failed to save settings:", error.message);
  }, []);

  return { settings, ready, save };
}

/* ---- timer: plain localStorage is fine in a real deployed app ---- */
function useTimer(storageKey = "cd_activeTimer") {
  const [timer, setTimer] = useState(() => {
    try {
      const raw = localStorage.getItem(storageKey);
      return raw ? JSON.parse(raw) : null;
    } catch { return null; }
  });
  const [now, setNow] = useState(Date.now());

  useEffect(() => {
    if (!timer) return;
    const id = setInterval(() => setNow(Date.now()), 1000);
    return () => clearInterval(id);
  }, [timer]);

  const start = useCallback((payload) => {
    const t = { ...payload, startedAt: new Date().toISOString() };
    setTimer(t);
    localStorage.setItem(storageKey, JSON.stringify(t));
  }, [storageKey]);

  const clear = useCallback(() => {
    setTimer(null);
    localStorage.removeItem(storageKey);
  }, [storageKey]);

  const elapsedMs = timer ? Math.max(0, now - new Date(timer.startedAt).getTime()) : 0;
  return { timer, ready: true, start, clear, elapsedMs };
}

function useAuth() {
  const [session, setSession] = useState(null);
  const [ready, setReady] = useState(false);

  useEffect(() => {
    sb.auth.getSession().then(({ data }) => {
      setSession(data.session);
      setReady(true);
    });
    const { data: sub } = sb.auth.onAuthStateChange((_event, sess) => {
      setSession(sess);
    });
    return () => sub.subscription.unsubscribe();
  }, []);

  return { session, ready };
}

function LoginScreen() {
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [error, setError] = useState("");
  const [loading, setLoading] = useState(false);

  const submit = async (e) => {
    e.preventDefault();
    setError("");
    setLoading(true);
    const { error } = await sb.auth.signInWithPassword({ email, password });
    setLoading(false);
    if (error) setError(error.message);
  };

  return (
    <div className="cd-login-root">
      <style>{LOGIN_CSS}</style>
      <form className="cd-login-card" onSubmit={submit}>
        <img src={LOGO_DATA_URI} alt="ihubSA" className="cd-login-logo" />
        <div className="cd-login-sub">Sign in to your billing &amp; ops ledger</div>
        <label className="cd-login-field">
          <span>Email</span>
          <input type="email" required value={email} onChange={(e) => setEmail(e.target.value)} autoFocus />
        </label>
        <label className="cd-login-field">
          <span>Password</span>
          <input type="password" required value={password} onChange={(e) => setPassword(e.target.value)} />
        </label>
        {error && <div className="cd-login-error">{error}</div>}
        <button className="cd-login-btn" type="submit" disabled={loading}>
          {loading ? "Signing in…" : "Sign in"}
        </button>
      </form>
    </div>
  );

};
const CURRENCY_CODES = Object.keys(CURRENCIES);
const fmtMoney = (n, currency = "USD") => {
  const sym = (CURRENCIES[currency] || CURRENCIES.USD).symbol;
  return `${sym}${(Number(n) || 0).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
};
const fmtDate = (iso) => {
  if (!iso) return "—";
  const d = new Date(iso + "T00:00:00");
  return d.toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" });
};
const fmtHrs = (n) => `${(Number(n) || 0).toFixed(2)}h`;

// Logs a time entry and, if it's tagged to a specific deck, recalculates that
// deck's % complete from total logged hours against it — so the Gantt chart
// stays in sync automatically as work gets logged.
async function logTimeEntry(entry, ctx) {
  const { timeEntries, projects } = ctx;
  const saved = await timeEntries.add(entry);
  if (saved && saved.deckDesc && saved.projectId) {
    const project = projects.items.find((p) => p.id === saved.projectId);
    const deckIdx = project?.decks?.findIndex((d) => d.desc === saved.deckDesc);
    if (project && deckIdx > -1) {
      const deck = project.decks[deckIdx];
      const deckHours = Number(deck.hours) || 0;
      if (deckHours > 0) {
        const totalLogged = [...timeEntries.items, saved]
          .filter((t) => t.projectId === project.id && t.deckDesc === saved.deckDesc)
          .reduce((s, t) => s + Number(t.hours || 0), 0);
        const newPct = Math.min(100, Math.round((totalLogged / deckHours) * 1000) / 10);
        const newDecks = project.decks.map((d, i) => i === deckIdx ? { ...d, percentComplete: newPct } : d);
        await projects.update(project.id, { decks: newDecks });
      }
    }
  }
  return saved;
}

// Same idea, but for editing an existing entry — recalculates whichever
// deck(s) are affected (the one it's now tagged to, and the one it moved
// away from, if any), grouped into a single write per project to avoid
// two edits racing and clobbering each other.
async function updateTimeEntryAndSync(id, patch, ctx) {
  const { timeEntries, projects } = ctx;
  const before = timeEntries.items.find((t) => t.id === id);
  const updated = await timeEntries.update(id, patch);
  const after = updated || { ...before, ...patch };
  const currentEntries = timeEntries.items.map((t) => (t.id === id ? after : t));

  const affected = [];
  if (after.projectId && after.deckDesc) affected.push({ projectId: after.projectId, deckDesc: after.deckDesc });
  if (before && before.projectId && before.deckDesc && (before.projectId !== after.projectId || before.deckDesc !== after.deckDesc)) {
    affected.push({ projectId: before.projectId, deckDesc: before.deckDesc });
  }

  const byProject = {};
  affected.forEach(({ projectId, deckDesc }) => {
    if (!byProject[projectId]) byProject[projectId] = new Set();
    byProject[projectId].add(deckDesc);
  });

  for (const projectId of Object.keys(byProject)) {
    const project = projects.items.find((p) => p.id === projectId);
    if (!project || !project.decks) continue;
    const deckDescs = byProject[projectId];
    const newDecks = project.decks.map((d) => {
      if (!deckDescs.has(d.desc)) return d;
      const deckHours = Number(d.hours) || 0;
      if (deckHours <= 0) return d;
      const totalLogged = currentEntries
        .filter((t) => t.projectId === projectId && t.deckDesc === d.desc)
        .reduce((s, t) => s + Number(t.hours || 0), 0);
      const newPct = Math.min(100, Math.round((totalLogged / deckHours) * 1000) / 10);
      return { ...d, percentComplete: newPct };
    });
    await projects.update(projectId, { decks: newDecks });
  }

  return after;
}

  const personalTime = useCollection("personal_time");
  const settingsHook = useSettings();

  const ctx = { clients, projects, timeEntries, meetings, invoices, clientNotes, comms, expenses, quotes, projectUpdates, personalTime, settings: settingsHook };
  const loading = !clients.ready || !projects.ready || !timeEntries.ready || !meetings.ready || !invoices.ready || !clientNotes.ready || !comms.ready || !expenses.ready || !quotes.ready || !projectUpdates.ready || !personalTime.ready || !settingsHook.ready;

  // Automations: run once per session after data loads — flip overdue invoices,
  // and generate draft retainer invoices for active retainer projects that are due.
  const automationRan = useRef(false);
  useEffect(() => {
    if (loading || automationRan.current) return;
    automationRan.current = true;

    const today = todayISO();
    const monthKey = today.slice(0, 7);
    const todayDay = Number(today.slice(8, 10));

    const overdueApplied = invoices.items.map((inv) =>
      inv.status === "sent" && inv.dueDate && inv.dueDate < today ? { ...inv, status: "overdue" } : inv
    );

    const existingRetainerKeys = new Set(invoices.items.map((i) => i.retainerKey).filter(Boolean));
    const newRetainer = [];
    projects.items.forEach((p) => {
      if (!p.isRetainer || p.status !== "active") return;
      const key = `${p.id}-${monthKey}`;
      const billDay = Number(p.retainerDay) || 1;
      if (todayDay >= billDay && !existingRetainerKeys.has(key)) {
        newRetainer.push({
          id: uid(), createdAt: today,
          clientId: p.clientId,
          currency: p.currency || "USD",
          date: today,
          dueDate: (() => { const d = new Date(); d.setDate(d.getDate() + 14); return d.toISOString().slice(0, 10); })(),
          lineItems: [{ desc: `Monthly retainer — ${p.name} (${monthLabel(monthKey)})`, amount: Number(p.retainerAmount) || 0 }],
          status: "draft",
          number: nextInvoiceNumber([...invoices.items, ...newRetainer], settingsHook.settings.invoicePrefix),
          retainerKey: key,
        });
      }
    });

    const changedOverdue = overdueApplied.some((inv, i) => inv.status !== invoices.items[i].status);
    if (changedOverdue || newRetainer.length) {
      invoices.setAll([...newRetainer, ...overdueApplied]);
    }
  }, [loading]);

  return (

  const activeProjects = projects.items.filter((p) => p.status === "active");

  const outstandingByCurrency = {};
  invoices.items.filter((i) => i.status === "sent" || i.status === "overdue").forEach((i) => {
    const cur = i.currency || "USD";
    outstandingByCurrency[cur] = (outstandingByCurrency[cur] || 0) + invoiceTotal(i);
  });
  const outstandingLabel = Object.keys(outstandingByCurrency).length === 0
    ? fmtMoney(0)
    : Object.entries(outstandingByCurrency).map(([cur, amt]) => fmtMoney(amt, cur)).join(" · ");

  const now = new Date();
  const weekStart = new Date(now); weekStart.setDate(now.getDate() - now.getDay());
  const days = Array.from({ length: 7 }, (_, i) => {
    const d = new Date(weekStart); d.setDate(weekStart.getDate() + i);
    return d.toISOString().slice(0, 10);
  });
  const hoursByDay = days.map((iso) => timeEntries.items.filter((t) => t.date === iso).reduce((s, t) => s + Number(t.hours || 0), 0));
  const maxHrs = Math.max(4, ...hoursByDay);

  const weekStartIso = weekStart.toISOString().slice(0, 10);
  const personalWeekHours = personalTime.items.filter((t) => t.date >= weekStartIso).reduce((s, t) => s + Number(t.hours || 0), 0);

  const upcoming = meetings.items
    .filter((m) => m.date >= todayISO())
    .sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time))
    .slice(0, 4);

  const recentTime = [...timeEntries.items].sort((a, b) => b.date.localeCompare(a.date)).slice(0, 5);

  const followUps = clients.items.filter((c) => {
    const hasActiveProject = projects.items.some((p) => p.clientId === c.id && p.status === "active");
    if (!hasActiveProject) return false;
    const clientComms = comms.items.filter((k) => k.clientId === c.id);
    if (clientComms.length === 0) return true;
    const lastDate = clientComms.reduce((max, k) => (k.date > max ? k.date : max), "0000-00-00");

    return daysSince >= 14;

          <div className="cd-punchcard">
            {days.map((iso, i) => (
              <div className="cd-punch-col" key={iso}>

            ))}

          ) : (

              {upcoming.map((m) => {

/* ------------------------------ Project Tracker ------------------------------ */
function ProjectTracker({ project, quotes, projects, updates }) {
  const [decks, setDecks] = useState(project.decks || []);
  const linkedQuote = quotes.find((q) => q.id === project.quoteId);
  const [linkQuoteId, setLinkQuoteId] = useState("");
  const linkableQuotes = quotes.filter((q) => q.clientId === project.clientId);

  const linkQuote = () => {
    if (!linkQuoteId) return;
    projects.update(project.id, { quoteId: linkQuoteId });
  };

  const persistDecks = (next) => projects.update(project.id, { decks: next });
  const updateDeckLocal = (i, patch) => setDecks(decks.map((d, idx) => idx === i ? { ...d, ...patch } : d));
  const addDeck = () => {
    const next = [...decks, { desc: "", hours: "", percentComplete: 0 }];
    setDecks(next);
    persistDecks(next);
  };
  const removeDeck = (i) => {
    const next = decks.filter((_, idx) => idx !== i);
    setDecks(next);
    persistDecks(next);
  };

  const recalcFromQuote = () => {
    if (!linkedQuote) return;
    const rate = Number(project.hourlyRate) || Number(linkedQuote.lineItems?.[0]?.rate) || 1;
    const next = (linkedQuote.lineItems || []).map((li) => {
      const hrs = Number(li.hours) || 0;
      const derivedHours = hrs > 0 ? hrs : Math.round((Number(li.amount || 0) / rate) * 100) / 100;
      // keep any progress already logged against a deck with the same name
      const existing = decks.find((d) => d.desc === li.desc);
      return { desc: li.desc, hours: derivedHours, percentComplete: existing ? Number(existing.percentComplete) || 0 : 0 };
    });
    setDecks(next);
    persistDecks(next);
  };

  const maxHours = Math.max(1, ...decks.map((d) => Number(d.hours) || 0));
  const totalHours = decks.reduce((s, d) => s + (Number(d.hours) || 0), 0);
  const overallPct = totalHours > 0
    ? Math.round(decks.reduce((s, d) => s + (Number(d.percentComplete) || 0) * (Number(d.hours) || 0), 0) / totalHours)
    : 0;

  const [updateDate, setUpdateDate] = useState(todayISO());
  const [updatePct, setUpdatePct] = useState("");
  const [updateContent, setUpdateContent] = useState("");
  const list = updates.items.filter((u) => u.projectId === project.id).sort((a, b) => (b.date + (b.createdAt || "")).localeCompare(a.date + (a.createdAt || "")));

  const addUpdate = (e) => {
    e.preventDefault();
    if (!updateContent.trim()) return;
    updates.add({ projectId: project.id, date: updateDate, content: updateContent.trim(), percentComplete: updatePct === "" ? null : Number(updatePct) });
    setUpdateContent("");
    setUpdatePct("");
  };

  return (
    <div className="cd-form">
      {linkedQuote && (
        <div className="cd-hint" style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 10 }}>
          <span>Linked quote: <strong className="mono">{linkedQuote.number}</strong></span>
          <Btn icon={Repeat} onClick={recalcFromQuote}>Recalculate deck hours from quote</Btn>
        </div>
      )}
      {!linkedQuote && linkableQuotes.length > 0 && (
        <div className="cd-hint">
          <div style={{ marginBottom: 8 }}>This project isn't linked to a quote yet — link one to pull in its decks automatically.</div>
          <div className="cd-form-row">
            <select value={linkQuoteId} onChange={(e) => setLinkQuoteId(e.target.value)}>
              <option value="">Select a quote…</option>
              {linkableQuotes.map((q) => <option key={q.id} value={q.id}>{q.number}</option>)}
            </select>
            <Btn kind="primary" onClick={linkQuote} disabled={!linkQuoteId}>Link quote</Btn>
          </div>
        </div>
      )}

      <div className="cd-subhead">Gantt — decks quoted on</div>
      {decks.length === 0 ? (
        <Empty icon={BarChart3} title="No decks yet" hint="Decks come in automatically when a quote converts to this project, or add them manually below." />
      ) : (
        <>
          <div className="cd-gantt-header">
            <span>Deck</span><span>Timeline</span><span>Hours</span><span>%</span><span></span>
          </div>
          <div className="cd-gantt">
            {decks.map((d, i) => {
              const hrs = Number(d.hours) || 0;
              const pct = Math.min(100, Math.max(0, Number(d.percentComplete) || 0));
              const barWidthPct = (hrs / maxHours) * 100;
              return (
                <div className="cd-gantt-row" key={i}>
                  <input
                    className="cd-gantt-desc" value={d.desc} placeholder="Deck description"
                    onChange={(e) => updateDeckLocal(i, { desc: e.target.value })}
                    onBlur={() => persistDecks(decks)}
                  />
                  <div className="cd-gantt-track">
                    <div className="cd-gantt-bar" style={{ width: `${barWidthPct}%` }}>
                      <div className="cd-gantt-fill" style={{ width: `${pct}%` }} />
                    </div>
                  </div>
                  <input
                    type="number" className="cd-gantt-hours" min="0" step="0.5" value={d.hours}
                    onChange={(e) => updateDeckLocal(i, { hours: e.target.value })}
                    onBlur={() => persistDecks(decks)}
                  />
                  <input
                    type="number" className="cd-gantt-pct" min="0" max="100" step="5" value={d.percentComplete}
                    onChange={(e) => updateDeckLocal(i, { percentComplete: e.target.value })}
                    onBlur={() => persistDecks(decks)}
                  />
                  <button type="button" className="cd-iconbtn danger" onClick={() => removeDeck(i)}><Trash2 size={14} /></button>
                </div>
              );
            })}
          </div>
        </>
      )}
      <button type="button" className="cd-linkbtn" onClick={addDeck}><Plus size={14} /> Add deck</button>
      {decks.length > 0 && (
        <div className="cd-invoice-total">Overall completion: <span className="mono">{overallPct}%</span> <span style={{ fontWeight: 400, fontSize: 12.5, color: "var(--ink-soft)" }}>({totalHours}h quoted total)</span></div>
      )}

      <div className="cd-subhead" style={{ marginTop: 18 }}>Project updates</div>
      <form onSubmit={addUpdate} className="cd-form">
        <div className="cd-form-row">
          <Field label="Date"><input type="date" value={updateDate} onChange={(e) => setUpdateDate(e.target.value)} /></Field>
          <Field label="Overall % complete (optional)"><input type="number" min="0" max="100" value={updatePct} onChange={(e) => setUpdatePct(e.target.value)} placeholder="e.g. 40" /></Field>
        </div>
        <Field label="Update"><textarea rows={3} value={updateContent} onChange={(e) => setUpdateContent(e.target.value)} placeholder="What happened, what's next…" /></Field>
        <div className="cd-form-actions"><Btn kind="primary" type="submit" icon={Plus}>Log update</Btn></div>
      </form>

      {list.length === 0 ? (
        <Empty icon={NotebookPen} title="No updates logged yet" hint="Log progress here as the project moves forward." />
      ) : (
        <ul className="cd-list">
          {list.map((u) => (
            <li className="cd-list-row" key={u.id} style={{ alignItems: "flex-start" }}>
              <div>
                <div className="cd-list-sub mono" style={{ marginBottom: 4 }}>{fmtDate(u.date)}{u.percentComplete != null ? ` · ${u.percentComplete}% complete` : ""}</div>
                <div style={{ fontSize: 13, whiteSpace: "pre-wrap" }}>{u.content}</div>
              </div>
              <button className="cd-iconbtn danger" onClick={() => updates.remove(u.id)}><Trash2 size={14} /></button>
            </li>
          ))}
        </ul>
      )}
    </div>
  );
}

/* ------------------------------ Overview ------------------------------ */
function projectCompletion(p, timeEntries) {
  const decks = p.decks || [];
  const totalDeckHours = decks.reduce((s, d) => s + (Number(d.hours) || 0), 0);
  if (totalDeckHours > 0) {
    const pct = Math.round(decks.reduce((s, d) => s + (Number(d.percentComplete) || 0) * (Number(d.hours) || 0), 0) / totalDeckHours);
    return { pct, source: "decks" };
  }
  if (p.budgetHours) {
    const logged = timeEntries.filter((t) => t.projectId === p.id).reduce((s, t) => s + Number(t.hours || 0), 0);
    return { pct: Math.min(100, Math.round((logged / p.budgetHours) * 100)), source: "hours" };
  }
  return { pct: null, source: "none" };
}

function TimerCard({ projects, onLog }) {
  const timerHook = useTimer();
  const [projectId, setProjectId] = useState(projects[0]?.id || "");
  const [deckDesc, setDeckDesc] = useState("");
  const [description, setDescription] = useState("");

  if (!timerHook.ready) return null;

  const fmtElapsed = (ms) => {
    const totalSec = Math.floor(ms / 1000);
    const h = String(Math.floor(totalSec / 3600)).padStart(2, "0");
    const m = String(Math.floor((totalSec % 3600) / 60)).padStart(2, "0");
    const s = String(totalSec % 60).padStart(2, "0");
    return `${h}:${m}:${s}`;
  };

  const stop = () => {
    const hours = Math.max(0.01, Math.round((timerHook.elapsedMs / 3600000) * 100) / 100);
    onLog({
      projectId: timerHook.timer.projectId, date: todayISO(), hours,
      description: timerHook.timer.description, deckDesc: timerHook.timer.deckDesc || "", billed: false,
    });
    timerHook.clear();
  };

  const activeProject = timerHook.timer ? projects.find((p) => p.id === timerHook.timer.projectId) : null;
  const selectedProject = projects.find((p) => p.id === projectId);
  const deckOptions = (selectedProject?.decks || []).filter((d) => d.desc);

  return (
    <section className="cd-card cd-timer-card">
      <div className="cd-card-head"><h3>Timer</h3></div>
      {timerHook.timer ? (
        <div className="cd-timer-active">
          <div className="cd-timer-clock mono">{fmtElapsed(timerHook.elapsedMs)}</div>
          <div className="cd-timer-meta">
            {activeProject?.name || "—"}
            {timerHook.timer.deckDesc ? ` — ${timerHook.timer.deckDesc}` : ""}
            {timerHook.timer.description ? ` · ${timerHook.timer.description}` : ""}
          </div>
          <Btn kind="primary" icon={Pause} onClick={stop}>Stop &amp; log</Btn>
        </div>
      ) : (
        <div className="cd-timer-idle">
          <select value={projectId} onChange={(e) => { setProjectId(e.target.value); setDeckDesc(""); }}>
            {projects.map((p) => <option key={p.id} value={p.id}>{p.name}</option>)}
          </select>
          {deckOptions.length > 0 && (
            <select value={deckDesc} onChange={(e) => setDeckDesc(e.target.value)}>
              <option value="">No specific deck</option>
              {deckOptions.map((d, i) => <option key={i} value={d.desc}>{d.desc}</option>)}
            </select>
          )}
          <input placeholder="What are you working on?" value={description} onChange={(e) => setDescription(e.target.value)} />
          <Btn kind="primary" icon={Play} onClick={() => timerHook.start({ projectId, description, deckDesc })} disabled={!projectId}>Start</Btn>
        </div>
      )}
    </section>
  );
}

/* ------------------------------ Quotes ------------------------------ */
function quoteSubtotal(q) {
  return (q.lineItems || []).reduce((s, li) => s + Number(li.amount || 0), 0);
}
function quoteTax(q) {
  return quoteSubtotal(q) * (Number(q.taxRate || 0) / 100);
}
function quoteTotal(q) {
  return quoteSubtotal(q) + quoteTax(q);
}
function nextQuoteNumber(quotes, prefix) {
  const nums = quotes.map((q) => parseInt((q.number || "").replace(/\D/g, ""), 10)).filter((n) => !isNaN(n));
  const next = (nums.length ? Math.max(...nums) : 2000) + 1;
  return `${prefix || "QTE"}-${next}`;
}

function QuotesView({ ctx }) {
  const { clients, projects, quotes, settings } = ctx;
  const [editing, setEditing] = useState(null); // "new" | quote
  const [viewing, setViewing] = useState(null); // quote to view/print
  const [filter, setFilter] = useState("all");

  const list = quotes.items.filter((q) => filter === "all" || q.status === filter).sort((a, b) => b.date.localeCompare(a.date));

  const save = (form) => {
    if (form.id) quotes.update(form.id, form);
    else quotes.add({ ...form, number: form.number || nextQuoteNumber(quotes.items, settings.settings.quotePrefix) });
    setEditing(null);
  };

  const setStatus = (q, status) => quotes.update(q.id, { status });

  const convertToProject = async (q) => {
    const hourlyLineHours = (q.lineItems || []).reduce((s, li) => s + Number(li.hours || 0), 0);
    const subtotal = quoteSubtotal(q);
    const blendedRate = hourlyLineHours > 0
      ? Math.round((subtotal / hourlyLineHours) * 100) / 100
      : Number(q.lineItems?.[0]?.rate || settings.settings.defaultHourlyRate || 0);
    const effectiveRate = blendedRate || Number(settings.settings.defaultHourlyRate) || 1;
    const client = clients.items.find((c) => c.id === q.clientId);
    const summary = (q.lineItems || []).map((li) => `• ${li.desc}${li.hours ? ` (${fmtHrs(li.hours)})` : ""} — ${fmtMoney(li.amount, q.currency)}`).join("\n");

    // For any line item quoted as a flat amount (no hours entered), derive an
    // equivalent duration in hours by dividing that amount by the effective rate —
    // so the Gantt chart still gets a meaningful duration to show.
    const decks = (q.lineItems || []).map((li) => {
      const hrs = Number(li.hours) || 0;
      const derivedHours = hrs > 0 ? hrs : Math.round((Number(li.amount || 0) / effectiveRate) * 100) / 100;
      return { desc: li.desc, hours: derivedHours, percentComplete: 0 };
    });
    const totalHours = decks.reduce((s, d) => s + (Number(d.hours) || 0), 0);

    const newProject = await projects.add({
      clientId: q.clientId,
      name: `${client?.company || client?.name || "New client"} — ${q.number}`,
      status: "active",
      hourlyRate: effectiveRate,
      currency: q.currency || "USD",
      budgetHours: totalHours || "",
      notes: `Converted from quote ${q.number}.\n${summary}`,
      isRetainer: false,
      retainerAmount: "",
      retainerDay: "",
      quoteId: q.id,
      decks,
    });

    if (newProject) {
      quotes.update(q.id, { status: "accepted", convertedProjectId: newProject.id });
    }
  };

  return (
    <div className="cd-page">
      <PageHead
        eyebrow="proposals"
        title="Quotes"
        action={<Btn kind="primary" icon={Plus} onClick={() => setEditing("new")} disabled={clients.items.length === 0}>New quote</Btn>}
      />

      <div className="cd-tabs">
        {["all", "draft", "sent", "accepted", "declined", "expired"].map((f) => (
          <button key={f} className={"cd-tab" + (filter === f ? " active" : "")} onClick={() => setFilter(f)}>{f}</button>
        ))}
      </div>

      {clients.items.length === 0 ? (
        <Empty icon={FileSignature} title="Add a client first" hint="Quotes are linked to a client." />
      ) : quotes.items.length === 0 ? (
        <Empty icon={FileSignature} title="No quotes yet" hint="Build a quote from hours and a rate, send it, and convert it to a project once accepted." />
      ) : list.length === 0 ? (
        <Empty icon={FileSignature} title="Nothing here" />
      ) : (
        <table className="cd-table">
          <thead><tr><th>Number</th><th>Client</th><th>Date</th><th>Valid until</th><th>Currency</th><th>Total</th><th>Status</th><th /></tr></thead>
          <tbody>
            {list.map((q) => (
              <tr key={q.id}>
                <td className="mono">{q.number}</td>
                <td>{clientName(clients, q.clientId)}</td>
                <td className="mono">{fmtDate(q.date)}</td>
                <td className="mono">{fmtDate(q.validUntil)}</td>
                <td className="mono">{q.currency || "USD"}</td>
                <td className="mono">{fmtMoney(quoteTotal(q), q.currency)}</td>
                <td><Stamp status={q.status} /></td>
                <td>
                  <div className="cd-row-actions">
                    <button className="cd-iconbtn" onClick={() => setViewing(q)} title="View / print"><FileText size={14} /></button>
                    {q.status === "draft" && <button className="cd-iconbtn" onClick={() => setEditing(q)} title="Edit"><Pencil size={14} /></button>}
                    {q.status === "draft" && <button className="cd-iconbtn" onClick={() => setStatus(q, "sent")} title="Mark sent"><Send size={14} /></button>}
                    {q.status === "sent" && <button className="cd-iconbtn" onClick={() => setStatus(q, "accepted")} title="Mark accepted"><CircleCheck size={14} /></button>}
                    {q.status === "sent" && <button className="cd-iconbtn" onClick={() => setStatus(q, "declined")} title="Mark declined"><X size={14} /></button>}
                    {q.status === "accepted" && !q.convertedProjectId && (
                      <Btn kind="primary" icon={FolderKanban} onClick={() => convertToProject(q)}>Create project</Btn>
                    )}
                    {q.convertedProjectId && <span className="cd-muted-mono">→ project created</span>}
                    <button className="cd-iconbtn danger" onClick={() => { if (confirm("Delete this quote?")) quotes.remove(q.id); }}><Trash2 size={14} /></button>
                  </div>
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      )}

      {editing && (
        <Modal title={editing === "new" ? "New quote" : "Edit quote"} onClose={() => setEditing(null)} wide>
          <QuoteForm initial={editing === "new" ? null : editing} clients={clients.items} settings={settings.settings} onSave={save} />
        </Modal>
      )}

      {viewing && (
        <Modal title={viewing.number} onClose={() => setViewing(null)} wide>
          <QuoteDoc quote={viewing} clients={clients.items} companyName={settings.settings.companyName} settings={settings.settings} />
        </Modal>
      )}
    </div>
  );
}

function QuoteForm({ initial, clients, settings, onSave }) {
  const [clientId, setClientId] = useState(initial?.clientId || clients[0]?.id || "");
  const [currency, setCurrency] = useState(initial?.currency || settings?.defaultCurrency || "USD");
  const [date, setDate] = useState(initial?.date || todayISO());
  const [validUntil, setValidUntil] = useState(initial?.validUntil || (() => {
    const d = new Date(); d.setDate(d.getDate() + 30); return d.toISOString().slice(0, 10);
  })());
  const [taxRate, setTaxRate] = useState(initial?.taxRate ?? settings?.defaultTaxRate ?? 0);
  const [notes, setNotes] = useState(initial?.notes || "");
  const [items, setItems] = useState(initial?.lineItems?.length ? initial.lineItems.map((li) => ({
    desc: li.desc || "", hours: li.hours || "", rate: li.rate || "", amount: li.amount || "",
  })) : [{ desc: "", hours: "", rate: "", amount: "" }]);

  const updateItem = (i, patch) => setItems(items.map((it, idx) => {
    if (idx !== i) return it;
    const next = { ...it, ...patch };
    // Convenience: auto-fill amount from hours × rate, but only when both are set —
    // leave it alone otherwise so a flat fee typed directly into Amount isn't overwritten.
    if ("hours" in patch || "rate" in patch) {
      const h = Number(next.hours) || 0;
      const r = Number(next.rate) || 0;
      if (h > 0 && r > 0) next.amount = h * r;
    }
    return next;
  }));
  const addItem = () => setItems([...items, { desc: "", hours: "", rate: "", amount: "" }]);
  const removeItem = (i) => setItems(items.filter((_, idx) => idx !== i));

  const lineItems = items
    .filter((it) => it.desc && Number(it.amount) > 0)
    .map((it) => ({ desc: it.desc, hours: Number(it.hours) || 0, rate: Number(it.rate) || 0, amount: Number(it.amount) || 0 }));
  const subtotal = lineItems.reduce((s, li) => s + li.amount, 0);
  const taxAmount = subtotal * (Number(taxRate || 0) / 100);
  const total = subtotal + taxAmount;

  return (
    <form className="cd-form" onSubmit={(e) => {
      e.preventDefault();
      if (lineItems.length === 0) return;
      onSave({
        id: initial?.id,
        number: initial?.number,
        clientId, currency, date, validUntil, taxRate: Number(taxRate) || 0, notes,
        lineItems, status: initial?.status || "draft",
      });
    }}>
      <div className="cd-form-row">
        <Field label="Client">
          <select value={clientId} onChange={(e) => setClientId(e.target.value)}>
            {clients.map((c) => <option key={c.id} value={c.id}>{c.company || c.name}</option>)}
          </select>
        </Field>
        <Field label="Currency">
          <select value={currency} onChange={(e) => setCurrency(e.target.value)}>
            {CURRENCY_CODES.map((c) => <option key={c} value={c}>{c}</option>)}
          </select>
        </Field>
      </div>
      <div className="cd-form-row">
        <Field label="Quote date"><input type="date" value={date} onChange={(e) => setDate(e.target.value)} /></Field>
        <Field label="Valid until"><input type="date" value={validUntil} onChange={(e) => setValidUntil(e.target.value)} /></Field>
        <Field label="Tax / VAT rate (%)"><input type="number" min="0" step="0.1" value={taxRate} onChange={(e) => setTaxRate(e.target.value)} /></Field>
      </div>

      <div className="cd-subhead">Line items — e.g. one per swim lane, deck, or phase</div>
      <div className="cd-hint" style={{ marginBottom: 4 }}>Fill in Hours + Rate for time-based work, or just type a flat Amount for anything else (e.g. materials, a fixed-fee deliverable).</div>
      {items.map((it, i) => (
        <div className="cd-form-row" key={i}>
          <input placeholder="Description (e.g. Deck 1 — Backend API)" value={it.desc} onChange={(e) => updateItem(i, { desc: e.target.value })} style={{ flex: 2 }} />
          <input type="number" placeholder="Hours (optional)" min="0" step="0.25" value={it.hours} onChange={(e) => updateItem(i, { hours: e.target.value })} style={{ maxWidth: 100 }} />
          <input type="number" placeholder="Rate (optional)" min="0" step="1" value={it.rate} onChange={(e) => updateItem(i, { rate: e.target.value })} style={{ maxWidth: 100 }} />
          <input type="number" placeholder="Amount" min="0" step="0.01" value={it.amount} onChange={(e) => updateItem(i, { amount: e.target.value })} style={{ maxWidth: 110 }} />
          <button type="button" className="cd-iconbtn danger" onClick={() => removeItem(i)}><Trash2 size={14} /></button>
        </div>
      ))}
      <button type="button" className="cd-linkbtn" onClick={addItem}><Plus size={14} /> Add line item</button>

      <Field label="Notes / terms"><textarea rows={3} value={notes} onChange={(e) => setNotes(e.target.value)} placeholder="Scope assumptions, exclusions, terms…" /></Field>

      <div className="cd-invoice-total" style={{ fontSize: 13, fontWeight: 400 }}>Subtotal: <span className="mono">{fmtMoney(subtotal, currency)}</span></div>
      {taxAmount > 0 && <div className="cd-invoice-total" style={{ fontSize: 13, fontWeight: 400 }}>Tax ({taxRate}%): <span className="mono">{fmtMoney(taxAmount, currency)}</span></div>}
      <div className="cd-invoice-total">Total: <span className="mono">{fmtMoney(total, currency)}</span></div>

      <div className="cd-form-actions"><Btn kind="primary" type="submit" disabled={lineItems.length === 0}>Save quote</Btn></div>
    </form>
  );
}

function QuoteDoc({ quote, clients, companyName, settings }) {
  const [copied, setCopied] = useState(false);
  const client = clients.find((c) => c.id === quote.clientId);
  const cur = quote.currency || "USD";
  const subtotal = quoteSubtotal(quote);
  const tax = quoteTax(quote);
  const total = quoteTotal(quote);

  const text = [
    companyName || null,
    settings?.companyAddress || null,
    settings?.vatNumber ? `VAT No: ${settings.vatNumber}` : null,
    "", "QUOTE", quote.number, "",
    `Prepared for: ${client?.company || client?.name || "—"}`,
    client?.email ? `Email: ${client.email}` : null,
    `Date: ${fmtDate(quote.date)}`,
    `Valid until: ${fmtDate(quote.validUntil)}`,
    "", "Line items:",
    ...quote.lineItems.map((li) => `- ${li.desc}${li.hours ? ` (${fmtHrs(li.hours)} @ ${fmtMoney(li.rate, cur)})` : ""} — ${fmtMoney(li.amount, cur)}`),
    "",
    `Subtotal: ${fmtMoney(subtotal, cur)}`,
    tax > 0 ? `Tax (${quote.taxRate}%): ${fmtMoney(tax, cur)}` : null,
    `Total: ${fmtMoney(total, cur)} ${cur}`,
    quote.notes ? `\n${quote.notes}` : null,
  ].filter(Boolean).join("\n");

  const copy = () => { navigator.clipboard.writeText(text); setCopied(true); setTimeout(() => setCopied(false), 1500); };

  return (
    <div className="cd-doc cd-printable">
      <DocLetterhead companyName={companyName} settings={settings} kind="Quote" number={quote.number} currency={cur} status={quote.status} />
      <div className="cd-doc-grid">
        <div><span>Prepared for</span><strong>{client?.company || client?.name}</strong>{client?.email && <div className="cd-muted">{client.email}</div>}{client?.address && <div className="cd-muted" style={{ whiteSpace: "pre-line" }}>{client.address}</div>}{client?.taxNumber && <div className="cd-muted">Tax No: {client.taxNumber}</div>}</div>
        <div><span>Date</span><strong className="mono">{fmtDate(quote.date)}</strong></div>
        <div><span>Valid until</span><strong className="mono">{fmtDate(quote.validUntil)}</strong></div>
      </div>
      <table className="cd-table">
        <thead><tr><th>Description</th><th>Hours</th><th>Rate</th><th>Amount</th></tr></thead>
        <tbody>
          {quote.lineItems.map((li, i) => (
            <tr key={i}>
              <td>{li.desc}</td>
              <td className="mono">{li.hours ? fmtHrs(li.hours) : "—"}</td>
              <td className="mono">{li.rate ? fmtMoney(li.rate, cur) : "—"}</td>
              <td className="mono">{fmtMoney(li.amount, cur)}</td>
            </tr>
          ))}
        </tbody>
      </table>
      <div className="cd-invoice-total" style={{ fontSize: 13, fontWeight: 400 }}>Subtotal: <span className="mono">{fmtMoney(subtotal, cur)}</span></div>
      {tax > 0 && <div className="cd-invoice-total" style={{ fontSize: 13, fontWeight: 400 }}>Tax ({quote.taxRate}%): <span className="mono">{fmtMoney(tax, cur)}</span></div>}
      <div className="cd-invoice-total">Total: <span className="mono">{fmtMoney(total, cur)}</span></div>

      {quote.notes && (
        <div className="cd-bank-details">
          <div className="cd-subhead">Terms &amp; notes</div>
          <div style={{ fontSize: 12.5, color: "var(--ink-soft)", whiteSpace: "pre-line", marginTop: 4 }}>{quote.notes}</div>
        </div>
      )}

      <div className="cd-doc-footer">This quote is valid until {fmtDate(quote.validUntil)}. Thank you for the opportunity to work together.</div>

      <div className="cd-form-actions">
        <Btn icon={Printer} onClick={() => window.print()}>Print / Save as PDF</Btn>
        <Btn kind="primary" icon={copied ? Check : Copy} onClick={copy}>{copied ? "Copied" : "Copy as text"}</Btn>
      </div>
    </div>
  );
}

        <img src={LOGO_DATA_URI} alt={companyName || "Company logo"} className="cd-doc-logo" />

          {companyName && <div className="cd-doc-company">{companyName}</div>}
          {settings?.companyAddress && <div className="cd-muted" style={{ whiteSpace: "pre-line" }}>{settings.companyAddress}</div>}
          <div className="cd-muted">
            {settings?.companyEmail || null}
            {settings?.vatNumber ? `${settings?.companyEmail ? " · " : ""}VAT No: ${settings.vatNumber}` : null}
          </div>
        </div>
      </div>
      <div className="cd-doc-head-right">
        <div className="cd-doc-kind">{kind}{currency ? ` · ${currency}` : ""}</div>

        {subtitle && <div className="cd-muted">{subtitle}</div>}
